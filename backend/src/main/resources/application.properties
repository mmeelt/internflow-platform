# PostgreSQL (Docker)
server.port=8081
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
# Project reports and demonstration videos can be substantial. Keep a bounded
# limit (configurable through Docker) while accepting realistic final videos.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:350MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:360MB}
app.upload.dir=${UPLOAD_DIR:../internflow-data/uploads}
app.malware-scan.enabled=${MALWARE_SCAN_ENABLED:false}
app.malware-scan.host=${MALWARE_SCAN_HOST:clamav}
app.malware-scan.port=${MALWARE_SCAN_PORT:3310}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myappdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — schema is created by database/init.sql via Docker
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Flyway upgrades both existing and fresh databases. Existing deployments prior
# to this change already contain the schema through V9, so Flyway baselines at
# V9 once, then applies every later migration transactionally.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=9
spring.flyway.baseline-description=Pre-Flyway schema through V9
spring.flyway.locations=classpath:db/migration


# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ??? JWT ??????????????????????????????????????????????????????????????????
# DEV ONLY secret below. In staging/prod, set JWT_SECRET as a real env var.
# Generate one with: python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(64)).decode())"
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:internflow-api}
security.jwt.audience=${JWT_AUDIENCE:internflow-web}
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000
# Set to true for every HTTPS deployment. It remains false only to allow
# cookie-based local development over http://localhost.
security.cookies.secure=${COOKIE_SECURE:false}

# One-time, deployment-only initial administrator. Leave disabled except while
# creating the first admin after a database reset.
security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
security.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}

# ??? CORS ?????????????????????????????????????????????????????????????????
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ??? Actuator ???????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Availability must not depend on a third-party SMTP server. Mail delivery is
# still required by the password-reset and approval flows themselves.
management.health.mail.enabled=false

# SMTP. Set these environment variables to the real mailbox used by Intern Portal.
# Authentication fails closed when mail cannot be delivered; no code is exposed
# in logs or API responses.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM}
security.mfa.code-expiration-minutes=1
security.mfa.max-attempts=5
# Password-reset codes are deliberately short-lived. The frontend presents
# this as a one-minute verification step before the password-change step.
security.password-reset.code-expiration-minutes=1

# AI is disabled until real provider keys are supplied through the deployment
# environment. Keys are never exposed to the frontend.
ai.enabled=${AI_ENABLED:false}
ai.primary-provider=${AI_PRIMARY_PROVIDER:gemini}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-5-mini}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
ai.rag.qdrant-url=${QDRANT_URL:http://qdrant:6333}
ai.rag.enabled=${AI_RAG_ENABLED:true}
ai.rag.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
