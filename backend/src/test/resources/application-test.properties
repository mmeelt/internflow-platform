# Isolated test configuration: never connect tests to the real PostgreSQL
# database and never require development or production credentials.
spring.datasource.url=jdbc:h2:mem:intern_portal_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

security.jwt.secret=dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMyNTYtdGVzdHMtb25seS1kby1ub3QtdXNlLWl0LXByb2R1Y3Rpb24=
security.jwt.issuer=intern-portal-test-api
security.jwt.audience=intern-portal-test-web
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000
security.cookies.secure=false
app.cors.allowed-origins=http://localhost:3000
security.mfa.code-expiration-minutes=1
security.mfa.max-attempts=5
security.password-reset.code-expiration-minutes=1

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
app.mail.from=test@example.com
app.malware-scan.enabled=false
ai.enabled=false
